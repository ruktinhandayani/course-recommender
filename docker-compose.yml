services:
  cre-ml-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: cre-ml-ui:frontend
    container_name: cre-ml-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      cre-ml-service:
        condition: service_healthy

  cre-ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: cre-ml-service:pre-mvp
    container_name: cre-ml-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      CRE_ML_ARTIFACT_DIR: course_recommender_artifacts_final
      CRE_ML_DATA_DIR: data
      CRE_ML_EXPORT_DIR: course_recommender_artifacts_final/export
      CRE_ML_MODEL_VERSION: ${CRE_ML_MODEL_VERSION:-cre-lstm-attention-h2-seed42-fullmask-v1}
      CRE_ML_API_KEY: ${CRE_ML_API_KEY:?Set CRE_ML_API_KEY in .env}
      CRE_ML_HMAC_SECRET: ${CRE_ML_HMAC_SECRET:?Set CRE_ML_HMAC_SECRET in .env}
      CRE_ML_TIMESTAMP_TOLERANCE_SECONDS: ${CRE_ML_TIMESTAMP_TOLERANCE_SECONDS:-60}
      CRE_ML_REQUIRE_AUTH: ${CRE_ML_REQUIRE_AUTH:-true}
      CRE_ML_ENABLE_TEST_UI: ${CRE_ML_ENABLE_TEST_UI:-true}
      CRE_ML_TEST_UI_ORIGINS: ${CRE_ML_TEST_UI_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      CRE_ML_ADMIN_USERNAME: ${CRE_ML_ADMIN_USERNAME:-admin}
      CRE_ML_ADMIN_PASSWORD: ${CRE_ML_ADMIN_PASSWORD:-}
      CRE_ML_ADMIN_PASSWORD_HASH: ${CRE_ML_ADMIN_PASSWORD_HASH:-}
      CRE_ML_SESSION_SECRET: ${CRE_ML_SESSION_SECRET:?Set CRE_ML_SESSION_SECRET in .env}
      CRE_ML_SESSION_COOKIE_SECURE: ${CRE_ML_SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data:ro
      - ./course_recommender_artifacts_final:/app/course_recommender_artifacts_final
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
